services:
  atlas:
    build: .
    image: argument-atlas:latest
    environment:
      ATLAS_MODE: ${ATLAS_MODE:-auto}
      ATLAS_MODEL: ${ATLAS_MODEL:-deepseek-flash}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      ATLAS_DB: /data/atlas.db
      ATLAS_NO_BROWSER: "1"
    ports:
      - "8000:8000"
    volumes:
      - atlas-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  atlas-data:
