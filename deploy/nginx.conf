# Argument Atlas - Nginx reverse proxy for NDJSON streaming
# Replace server_name and add TLS (e.g. certbot) before production use.
# Basic Auth is optional; see docs/deployment.md.

upstream argument_atlas_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name argument-atlas.example.com;

    # Only text is posted (12,000 chars); keep a small limit.
    client_max_body_size 1m;

    location / {
        proxy_pass http://argument_atlas_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # NDJSON: never buffer, allow long-running model calls.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Accel-Buffering no;

        # Basic hardening headers.
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
    }

    # Health probe without access-log noise.
    location = /api/health {
        access_log off;
        proxy_pass http://argument_atlas_backend;
        proxy_set_header Host $host;
    }
}
