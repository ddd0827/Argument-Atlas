[project]
name = "argument-atlas"
version = "0.1.0"
description = "Argument Atlas - turn an article into an interactive argument map with DeepSeek and FastAPI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "live: calls a real LLM API and is skipped unless explicitly enabled",
]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
